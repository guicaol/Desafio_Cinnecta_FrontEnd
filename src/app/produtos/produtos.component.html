<div class="comic-page">

  <header class="comic-hero">
    <span class="comic-hero__burst">NEW!</span>
    <div class="comic-hero__inner">
      <p class="comic-hero__kicker">★ Banca de Quadrinhos ★</p>
      <h1 class="comic-hero__title">Hqs Marvel</h1>
      <p class="comic-hero__lead">Escolha e compre a sua agora mesmo!</p>
    </div>
  </header>

  <section class="comic-grid" *ngIf="comics?.data?.results as results; else loading">
    <article class="comic-card"
             *ngFor="let comic of results; let i = index"
             [routerLink]="'detalhesProdutos/' + comic.id"
             [style.animation-delay]="(i * 55) + 'ms'">
      <div class="comic-card__media">
        <span class="comic-card__num">#{{ i + 1 }}</span>
        <img class="comic-card__img"
             src="{{ comic.thumbnail.path }}/portrait_incredible.jpg"
             alt="Capa de {{ comic.title }}"
             loading="lazy">
        <span class="comic-card__price">${{ comic.prices[0].price }}</span>
      </div>
      <div class="comic-card__body">
        <h2 class="comic-card__title">{{ comic.title }}</h2>
        <span class="comic-card__cta">Ver edição →</span>
      </div>
    </article>
  </section>

  <ng-template #loading>
    <div class="comic-loading">
      <span class="comic-loading__pow">Loading…</span>
      <p>Buscando as edições na torre da Marvel.</p>
    </div>
  </ng-template>

</div>
